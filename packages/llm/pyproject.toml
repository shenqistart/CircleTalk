[project]
name = "bedrock-llm"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "bedrock-core",
    "deepagents>=0.2",
    "Jinja2>=3.1",
    "langchain>=1.2",
    "langchain-community>=0.4",
    "langchain-openai>=1.1",
    "langchain-text-splitters>=1.1",
    "openai>=2.0",
    "ollama>=0.6",
    "pgvector>=0.4",
]

[tool.uv.sources]
bedrock-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm"]

[tool.ruff.lint.per-file-ignores]
"src/llm/models/providers/ollama.py" = [
    "ARG002",
]
