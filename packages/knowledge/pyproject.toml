[project]
name = "bedrock-knowledge"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "bedrock-core",
]

[tool.uv.sources]
bedrock-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge"]
