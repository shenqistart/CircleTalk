[project]
name = "bedrock-core"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "sqlalchemy-utils>=0.42",
    "psycopg[binary]>=3.3",
    "redis>=7.0",
    "pydantic>=2.0",
    "alembic>=1.14",
    "minio>=7.0",
    "python-magic>=0.4",
    "pyyaml>=6.0",
    "jieba>=0.42",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]
