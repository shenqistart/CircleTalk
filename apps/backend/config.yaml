server:
  port: 8000
  name: bedrock

cache:
  backend: memory

redis:
  host: localhost
  port: 6379
  password: null

database:
  host: localhost
  port: 5432
  username: postgres
  password: postgres
  pool_size: 20
  max_overflow: 5

storage:
  backend: minio
  endpoint: localhost:9000
  access_key: minioadmin
  secret_key: minioadmin
  bucket: bedrock

tenants:
  default:
    database:
      name: bedrock
