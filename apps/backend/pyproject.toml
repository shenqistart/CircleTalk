[project]
name = "bedrock-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "bedrock-core",
    "fastapi==0.135.1",
    "uvicorn[standard]==0.41.0",
    "sqlalchemy==2.0.48",
    "alembic==1.18.4",
    "psycopg[binary]==3.3.3",
    "redis==7.1.0",
    "minio==7.2.20",
    "dependency-injector==4.48.3",
    "pydantic==2.12.5",
    "orjson==3.11.7",
    "pyyaml==6.0.3",
]

[tool.uv.sources]
bedrock-core = { workspace = true }

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=9.0",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "SIM", "I", "UP", "S", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
