# Render blueprint notes:
# CircleTalk production is a two-service SaaS. Do not deploy only FastAPI +
# Postgres and call it complete; the production web app lives in apps/open-saas/app.

databases:
  - name: circletalk-postgres
    databaseName: circletalk
    user: circletalk
    plan: free

services:
  - type: web
    name: circletalk-wasp-web
    runtime: node
    plan: starter
    rootDir: apps/open-saas/app
    buildCommand: wasp build
    startCommand: cd .wasp/build && npm install && npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: circletalk-postgres
          property: connectionString
      - key: WASP_SERVER_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYMENTS_HOBBY_SUBSCRIPTION_PLAN_ID
        sync: false
      - key: PAYMENTS_PRO_SUBSCRIPTION_PLAN_ID
        sync: false
      - key: PAYMENTS_CREDITS_10_PLAN_ID
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: AI_WORKER_URL
        sync: false
      - key: AI_WORKER_SHARED_SECRET
        sync: false
      - key: ROUNDTABLE_STREAM_TOKEN_SECRET
        sync: false

  - type: pserv
    name: circletalk-ai-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: AI_WORKER_SHARED_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ENABLE_LEGACY_ROUNDTABLE_API
        value: false
      - key: CONFIG_PATH
        value: /app/apps/backend/config.yaml
      - key: DATABASE_URL
        fromDatabase:
          name: circletalk-postgres
          property: connectionString
      - key: ROUNDTABLE_LLM_ENABLED
        value: true
      - key: ROUNDTABLE_LLM_MODEL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ROUNDTABLE_LLM_API_KEY
        sync: false
      - key: ROUNDTABLE_LLM_BASE_URL
        sync: false
