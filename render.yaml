databases:
  - name: bedrock-postgres
    databaseName: bedrock
    user: bedrock
    plan: free

services:
  - type: web
    name: bedrock-backend
    runtime: docker
    plan: free
    dockerfilePath: ./apps/backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bedrock-postgres
          property: connectionString
      - key: CONFIG_PATH
        value: /app/apps/backend/config.yaml
      - key: ROUNDTABLE_LLM_ENABLED
        value: false
      - key: ROUNDTABLE_LLM_MODEL
        sync: false
      - key: ROUNDTABLE_LLM_API_KEY
        sync: false
      - key: ROUNDTABLE_LLM_BASE_URL
        sync: false
    preDeployCommand: cd /app/apps/backend && alembic upgrade head
